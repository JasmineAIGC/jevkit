name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  kev-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest pydantic datasets
      - name: Clone kev (shallow)
        run: git clone --depth 1 https://github.com/jaredpalmer/kev /tmp/kev
      - name: Contract tests against real kev source
        env:
          KEV_SRC: /tmp/kev
        run: pytest tests/test_kev_compat.py -v

  typesafe-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with optional extras
        run: pip install -e '.[typesafe,dev]'
      - name: SDK adapter import smoke
        run: |
          python - <<'EOF'
          import typesafe_sdk
          from jevkit import TypesafeSdkBackend, make_backend, Choice, Noul, Score
          b = make_backend("typesafe://jev-1.13.0")
          conv = TypesafeSdkBackend._convert_questions({
              "dep": Choice("Which?", {"a": "x", "b": None}),
              "esc": Noul("Urgent?"),
              "fr": Score("How?", ["low", "high"])})
          assert set(conv) == {"dep", "esc", "fr"}
          print("typesafe-sdk", typesafe_sdk.__name__, "OK")
          EOF
      - name: Test
        run: pytest -q --ignore=tests/test_kev_compat.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
